    <main>
        <h1 class="project-title">Intro al collage</h1>
        <section class="project-content collage-board" aria-label="Obras de Intro al collage">
            <div class="opening-pair">
                <figure class="collage-piece canvas-piece">
                    <img src="assets/images/intro-al-collage/acrilico-papel-lienzo-70x100-2024.jpg" alt="Acrílico y papel sobre lienzo" loading="lazy">
                    <figcaption>Acrílico y collage de papel sobre lienzo, 100 × 70 cm, 2024.</figcaption>
                </figure>
                <figure class="collage-piece red-piece">
                    <img src="assets/images/intro-al-collage/collage-50x70-2024.jpg" alt="Collage rojo y gris" loading="lazy">
                    <figcaption>Collage, 70 × 50 cm, 2024.</figcaption>
                </figure>
            </div>

            <figure class="collage-piece sold-piece">
                <img src="assets/images/intro-al-collage/oleo-lienzo-146x97-2024-vendido.jpg" alt="Óleo sobre lienzo en tonos rojos oscuros" loading="lazy">
                <figcaption>Óleo sobre lienzo, 97 × 146 cm, 2024, <em>vendido</em>.</figcaption>
            </figure>

            <figure class="collage-piece square-piece">
                <img src="assets/images/intro-al-collage/acrilico-papel-carton-65x65-2025.jpg" alt="Acrílico y papel sobre cartón en formato cuadrado" loading="lazy">
                <figcaption>Acrílico y collage de papel sobre cartón, 65 × 65 cm, 2025.</figcaption>
            </figure>

            <figure class="collage-piece horizontal-piece">
                <img src="assets/images/intro-al-collage/acrilico-papel-carton-50x70-2025.jpg" alt="Acrílico y papel sobre cartón en formato horizontal" loading="lazy">
                <figcaption>Acrílico y collage de papel sobre cartón, 50 × 70 cm, 2025.</figcaption>
            </figure>

            <figure class="collage-piece full-bleed-piece">
                <img src="assets/images/intro-al-collage/acrilico-papel-160x100-2024.jpg" alt="Acrílico y papel en tonos ocres" loading="lazy">
                <figcaption>Acrílico y collage de papel, 160 × 100 cm, 2024.</figcaption>
            </figure>

            <figure class="collage-piece wall-series">
                <img src="assets/images/intro-al-collage/serie-collages-a3plus-2024.jpg" alt="Serie de seis collages instalada en pared" loading="lazy">
                <figcaption>Serie de 6 collages sobre papel, formato A3+, 2024.</figcaption>
            </figure>

            <figure class="collage-piece tall-piece">
                <div class="two-views">
                    <img src="assets/images/intro-al-collage/collage-45x75-2024-01.jpg" alt="Vista frontal de collage de 45 por 75 centímetros" loading="lazy">
                    <img src="assets/images/intro-al-collage/collage-45x75-2024-02.jpg" alt="Segunda vista del collage de 45 por 75 centímetros" loading="lazy">
                </div>
                <figcaption>Collage, 75 × 45 cm, 2024.</figcaption>
            </figure>

            <div class="collage-series pink-series">
                <div class="pink-series-images">
                    <figure><img src="assets/images/intro-al-collage/serie-rosa-01-2025.jpg" alt="Primera obra de la serie de collages sobre papel" loading="lazy"></figure>
                    <figure><img src="assets/images/intro-al-collage/serie-rosa-02-2025.jpg" alt="Segunda obra de la serie de collages sobre papel" loading="lazy"></figure>
                    <figure><img src="assets/images/intro-al-collage/serie-rosa-03-2025.jpg" alt="Tercera obra de la serie de collages sobre papel" loading="lazy"></figure>
                    <figure><img src="assets/images/intro-al-collage/serie-rosa-04-2025.jpg" alt="Cuarta obra de la serie de collages sobre papel" loading="lazy"></figure>
                    <figure><img src="assets/images/intro-al-collage/serie-rosa-05-2025.jpg" alt="Quinta obra de la serie de collages sobre papel" loading="lazy"></figure>
                </div>
                <p class="series-info">Serie de 5 collages con tinta, pastel y acrílico sobre papel, formato A3+, 2025.</p>
            </div>

            <figure class="collage-piece panorama-piece">
                <img src="assets/images/intro-al-collage/acrilico-papel-carton-45x180-2025.jpg" alt="Composición horizontal de acrílico y papel sobre cartón" loading="lazy">
                <figcaption>Acrílico y collage de papel sobre cartón, 45 × 180 cm, 2025.</figcaption>
            </figure>

            <figure class="collage-piece small-formats">
                <img src="assets/images/intro-al-collage/collages-a5-a4-2025.jpg" alt="Conjunto de collages de pequeño formato" loading="lazy">
                <figcaption>Collage, acrílico y pastel sobre papel, formatos A5 y A4 aprox., 2025.</figcaption>
            </figure>

            <figure class="collage-piece a3-piece">
                <img src="assets/images/intro-al-collage/collage-a3plus-2025.jpg" alt="Collage sobre papel en formato A3+" loading="lazy">
                <figcaption>Collage sobre papel, formato A3+, 2025.</figcaption>
            </figure>
